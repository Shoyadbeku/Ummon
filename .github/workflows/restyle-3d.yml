name: Restyle photo to 3D

on:
  workflow_dispatch:
  push:
    paths:
      - inputs/**
      - scripts/restyle.py
      - .github/workflows/restyle-3d.yml

permissions:
  contents: write

jobs:
  restyle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install gradio_client
      - name: Restyle
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/restyle.py inputs/crosswalk.jpg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crosswalk-3d
          path: images/crosswalk_3d_*
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images
          git diff --cached --quiet || git commit -m "Add 3D-restyled crosswalk images [skip ci]"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
