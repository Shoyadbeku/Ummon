name: TripoSR image to 3D

on:
  workflow_dispatch:
  push:
    paths:
      - inputs/**
      - .github/workflows/triposr.yml

permissions:
  contents: write

jobs:
  triposr:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install TripoSR (CPU)
        run: |
          git clone --depth 1 https://github.com/VAST-AI-Research/TripoSR.git ../TripoSR
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r ../TripoSR/requirements.txt onnxruntime
      - name: Image to 3D
        run: |
          python ../TripoSR/run.py inputs/crosswalk.jpg --device cpu \
            --output-dir out --foreground-ratio 0.85 --model-save-format glb \
            --render
          ls -R out
      - name: Collect results
        run: |
          mkdir -p images/triposr
          cp out/0/mesh.glb out/0/input.png images/triposr/
          cp out/0/render.mp4 images/triposr/ 2>/dev/null || true
          for n in 000 007 015 022; do cp out/0/render_$n.png images/triposr/ 2>/dev/null || true; done
      - uses: actions/upload-artifact@v4
        with:
          name: triposr
          path: out/
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/triposr
          git diff --cached --quiet || git commit -m "Add TripoSR 3D model of crosswalk photo [skip ci]"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
