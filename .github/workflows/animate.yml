name: Animate images
on:
  push:
    branches: [media-input]
    paths: [images/**, tools/**, .github/workflows/animate.yml]
permissions:
  contents: write
jobs:
  animate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        id: ["03"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q gradio_client
      - run: python tools/animate.py images/${{ matrix.id }}.jpg ${{ matrix.id }} videos/${{ matrix.id }}.mp4
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - uses: actions/upload-artifact@v4
        with: { name: "video-${{ matrix.id }}", path: "videos/${{ matrix.id }}.mp4" }
  commit:
    needs: animate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "video-*", path: videos, merge-multiple: true }
      - name: Commit videos
        run: |
          ls -la videos || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add videos
          git commit -m "Add generated 10s talking videos [skip ci]" || exit 0
          git push
