services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: yhq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yhq_change_me}
      POSTGRES_DB: yhq
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yhq -d yhq"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://yhq:${POSTGRES_PASSWORD:-yhq_change_me}@db:5432/yhq?schema=public
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-YHQ Mashq}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD ni .env faylida belgilang}
      # HTTPS siz (masalan, localhost) sinash uchun: INSECURE_COOKIES=1
      INSECURE_COOKIES: ${INSECURE_COOKIES:-}
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
