<style>

:root {

  --navy: #0b2a66; --navy-fg: #ffffff; --blue: #5b9bff; --blue-soft: #16294a;
  --ok: #3ccf7f; --ok-soft: #0f2c1e; --bad: #ff6b6f; --bad-soft: #3a1518; --warn: #f3b450; --warn-soft: #33250c;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark; } }

  --navy: #0b2a66; --navy-fg: #ffffff; --blue: #5b9bff; --blue-soft: #16294a;
  --ok: #3ccf7f; --ok-soft: #0f2c1e; --bad: #ff6b6f; --bad-soft: #3a1518; --warn: #f3b450; --warn-soft: #33250c;

.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; padding: 16px; }

<script>
"use strict";
// ───────────────── Transliteratsiya (lotin → kirill) ─────────────────
const APOS = "['‘’ʻʼ`]";
const TR_RULES = [[new RegExp("o" + APOS, "g"), "ў"], [new RegExp("O" + APOS, "g"), "Ў"], [new RegExp("g" + APOS, "g"), "ғ"], [new RegExp("G" + APOS, "g"), "Ғ"],
  [/sh/g, "ш"], [/S[hH]/g, "Ш"], [/ch/g, "ч"], [/C[hH]/g, "Ч"], [/yo/g, "ё"], [/Y[oO]/g, "Ё"], [/yu/g, "ю"], [/Y[uU]/g, "Ю"], [/ya/g, "я"], [/Y[aA]/g, "Я"],
  [/ye/g, "е"], [/Y[eE]/g, "Е"], [/(?<![\p{L}\p{N}])e/gu, "э"], [/(?<![\p{L}\p{N}])E/gu, "Э"], [new RegExp(APOS, "g"), "ъ"]];
const TR_SINGLE = { a: "а", b: "б", v: "в", g: "г", d: "д", e: "е", j: "ж", z: "з", i: "и", y: "й", k: "к", l: "л", m: "м", n: "н", o: "о", p: "п", r: "р", s: "с", t: "т", u: "у", f: "ф", x: "х", q: "қ", h: "ҳ", c: "с", w: "в" };
const KEEP = /(https?:\/\/\S+|\b[A-Z]{2,}\b|“[A-Z0-9]+”|"[A-Z0-9]+")/g;
function toCyr(text) {
  return String(text).split(KEEP).map((p, i) => {
    if (i % 2) return p;
    for (const [re, r] of TR_RULES) p = p.replace(re, r);
    let o = ""; for (const ch of p) { const l = ch.toLowerCase(); o += l in TR_SINGLE ? (ch === l ? TR_SINGLE[l] : TR_SINGLE[l].toUpperCase()) : ch; } return o;
  }).join("");
}
let cyr = false;
const tr = (s) => (s == null ? "" : cyr ? toCyr(s) : String(s));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const T = (s) => esc(tr(s));
const L = ["A", "B", "C", "D", "E", "F"];
const fmtTime = (s) => `${Math.floor(s / 60)}:${String(Math.max(0, s % 60)).padStart(2, "0")}`;
const fmtDate = (ts) => { const d = new Date(ts), p = (n) => String(n).padStart(2, "0"); return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()}, ${p(d.getHours())}:${p(d.getMinutes())}`; };
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// Imtihon formati (ochiq manbalardagi ma'lumot, rasmiy tasdiqlanmagan)
const EXAM = { count: 20, minutes: 25, maxErrors: 2 };

// ───────────────── Saqlash: Claude bazasi (har bir foydalanuvchiga alohida) yoki brauzer ─────────────────
const LS_KEY = "yhq-mashq-v1";
const blank = () => ({ v: 1, updatedAt: 0, tickets: {}, prog: {}, saved: [], history: [], current: null });
const Store = {
  s: blank(), mode: "local", ref: null, writing: false, again: false,
  load() { try { const raw = localStorage.getItem(LS_KEY); if (raw) this.s = Object.assign(blank(), JSON.parse(raw)); } catch {} },
  async connect() {
    try {
      const c = window.claude; if (!c || !c.use) return;
      const [user, db] = await Promise.all([c.use("user"), c.use("db")]);
      if (!user || !db) return;
      const id = await user.id(); if (!id) return;
      const ref = db.doc("data/users/" + id + "/progress");
      const snap = await Promise.race([ref.get(), new Promise((_, r) => setTimeout(() => r(new Error("timeout")), 10000))]);
      this.ref = ref; this.mode = "cloud";
      const remote = snap.exists ? snap.data() : null;
      if (remote && (remote.updatedAt || 0) > (this.s.updatedAt || 0)) {
        this.s = Object.assign(blank(), JSON.parse(JSON.stringify(remote)));
        try { localStorage.setItem(LS_KEY, JSON.stringify(this.s)); } catch {}
        render();
      } else if (this.s.updatedAt) { this.flush(); }
      renderFoot();
    } catch { this.mode = "local"; renderFoot(); }
  },
  save() {
    this.s.updatedAt = Date.now();
    if (this.s.history.length > 120) this.s.history = this.s.history.slice(-120);
    try { localStorage.setItem(LS_KEY, JSON.stringify(this.s)); } catch {}
    this.flush();
  },
  async flush() {
    if (this.mode !== "cloud" || !this.ref) return;
    if (this.writing) { this.again = true; return; }
    this.writing = true;
    try { await this.ref.set(JSON.parse(JSON.stringify(this.s))); }
    catch (e) { if (e && (e.code === "invalid_argument" || e.code === "not_granted" || e.code === "revoked")) { this.mode = "local"; renderFoot(); } }
    this.writing = false;
    if (this.again) { this.again = false; this.flush(); }
  },
};

// ───────────────── Ma'lumotlar ─────────────────
let D = null, Q = {}, CAT = {};
async function loadData() {
  const r = await fetch("data.json");
  if (!r.ok) throw new Error("data");
  D = await r.json();
  for (const q of D.questions) Q[q.code] = q;
  for (const c of D.categories) CAT[c.slug] = c;
}

// ───────────────── Progress qoidalari ─────────────────
function applyAnswer(code, ok) {
  const p = Store.s.prog[code] || { seen: 0, ok: 0, bad: 0, streak: 0, mis: false };
  p.seen++; if (ok) { p.ok++; p.streak++; } else { p.bad++; p.streak = 0; }
  // Xato qilingan savol "xatolarim"ga tushadi, ketma-ket 2 marta to'g'ri ishlanganda chiqadi
  p.mis = ok ? (p.mis ? p.streak < 2 : false) : true;
  p.last = ok; p.at = Date.now();
  Store.s.prog[code] = p;
}
function ticketStatus(n) {
  const cur = Store.s.current;
  if (cur && !cur.done && cur.kind === "TICKET" && cur.ticket === n) return "prog";
  const t = Store.s.tickets[n];
  if (!t) return "none";
  return t.correct === t.total ? "ok" : "bad";
}

// ───────────────── Test sessiyasi ─────────────────
function startTest({ kind, mode = "LEARN", ticket, cat, codes }) {
  let qs = [];
  if (kind === "TICKET") qs = D.tickets.find((t) => t.n === ticket).q;
  else if (kind === "EXAM") qs = shuffle(D.questions.map((q) => q.code)).slice(0, EXAM.count);
  else if (kind === "RANDOM") qs = shuffle(D.questions.map((q) => q.code)).slice(0, 10);
  else if (kind === "TOPIC") qs = shuffle(D.questions.filter((q) => q.cat === cat).map((q) => q.code)).slice(0, 10);
  else if (kind === "SIGNS") qs = shuffle(D.questions.filter((q) => q.cat === "belgilar" || q.sign).map((q) => q.code)).slice(0, 10);
  else qs = shuffle(codes).slice(0, 20);
  if (!qs.length) return;
  const exam = mode === "EXAM";
  const minutes = kind === "EXAM" ? EXAM.minutes : Math.max(1, Math.ceil(EXAM.minutes * qs.length / EXAM.count));
  Store.s.current = {
    kind, mode, ticket: ticket ?? null, cat: cat ?? null, qs, idx: 0, ans: {},
    started: Date.now(), deadline: exam ? Date.now() + minutes * 60000 : null,
    maxErrors: exam ? Math.floor(EXAM.maxErrors * qs.length / EXAM.count) : null, done: false,
  };
  Store.save();
  go("test");
}
function finishTest(auto) {
  const c = Store.s.current; if (!c || c.done) return;
  let correct = 0;
  for (const code of c.qs) {
    const a = c.ans[code]; const ok = !!a && a.sel != null && a.sel === Q[code].a;
    if (ok) correct++;
    if (c.mode === "EXAM") applyAnswer(code, ok); // o'quv rejimida progress har tekshiruvda yangilanadi
  }
  const end = auto && c.deadline ? Math.min(Date.now(), c.deadline) : Date.now();
  const res = { id: "r" + Date.now(), kind: c.kind, mode: c.mode, ticket: c.ticket, cat: c.cat, qs: c.qs, ans: c.ans, correct, total: c.qs.length,
    dur: Math.round((end - c.started) / 1000), at: end, maxErrors: c.maxErrors };
  res.passed = c.maxErrors != null ? res.total - correct <= c.maxErrors : correct === res.total;
  if (c.kind === "TICKET") Store.s.tickets[c.ticket] = { correct, total: res.total, at: end };
  Store.s.history.push(res);
  c.done = true; Store.s.current = null; Store.s.lastResult = res;
  Store.save();
  go("natija");
}

  const inp = document.getElementById("sq"); inp.focus();
  let t; inp.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => {
    const q = inp.value.trim().toLowerCase(); const box = document.getElementById("sres");
    if (q.length < 2) { box.innerHTML = `<p class="muted small">${T("Kamida 2 ta belgi kiriting.")}</p>`; return; }
    const res = D.questions.filter((x) => x.code.toLowerCase() === q || x.text.toLowerCase().includes(q) || (x.rule || "").toLowerCase().includes(q) || x.exp.toLowerCase().includes(q) || x.opts.some((o) => o.toLowerCase().includes(q))).slice(0, 30);
    box.innerHTML = res.length ? `<p class="muted small">${res.length} ${T("ta natija")}</p>` + res.map((x) => qCard(x)).join("") : `<p class="muted">${T("Hech narsa topilmadi.")}</p>`;
  }, 200); });
}

// ───────────────── Test oynasi ─────────────────
function vTest() {
  const c = Store.s.current;
  if (!c || c.done) return `<div class="card pad" style="text-align:center"><p>${T("Faol test yo'q.")}</p><a class="btn accent" href="#biletlar">${T("Biletlarga o'tish")}</a></div>`;
  const exam = c.mode === "EXAM";
  const code = c.qs[c.idx]; const q = Q[code]; const a = c.ans[code] || {};
  const locked = !exam && (a.checked || a.revealed);
  const answered = c.qs.filter((k) => c.ans[k] && (c.ans[k].sel != null || c.ans[k].revealed)).length;
  const title = c.kind === "TICKET" ? `${tr("Bilet")} №${c.ticket}` : tr({ EXAM: "Imtihon", RANDOM: "Tasodifiy test", TOPIC: CAT[c.cat]?.name || "Mavzu", MISTAKES: "Xatolarni qayta ishlash", SIGNS: "Belgilar testi", SAVED: "Saqlangan savollar" }[c.kind]);
  const media = q.scene ? q.scene : q.sign ? (D.signSvg[q.sign] || "") : "";
  return `<div class="testpage" style="max-width:780px;margin:auto">
  <div class="row" style="justify-content:space-between"><div><h1 style="font-size:24px">${esc(title)}</h1><span class="pill ${exam ? "warn" : "blue"}">${T(exam ? "Imtihon rejimi" : "O'rganish rejimi")}</span></div>
    ${c.deadline ? `<div class="timer" id="timer" aria-live="polite" aria-label="${T("Qolgan vaqt")}">--:--</div>` : ""}</div>
  <div class="row small" style="justify-content:space-between;margin-top:14px"><b id="qcount">${T("Savol")} №${c.idx + 1} / ${c.qs.length}</b><span class="muted">${answered}/${c.qs.length}</span></div>
  <div class="bar-track" style="margin-top:6px"><i style="width:${answered / c.qs.length * 100}%;background:var(--blue)"></i></div>
  <div class="qnav" role="navigation" aria-label="${T("Savollar")}">${c.qs.map((k, i) => {
    const x = c.ans[k]; let cls = "";
    if (x && !exam && (x.checked || x.revealed)) cls = x.sel === Q[k].a ? "ok" : "bad"; else if (x && x.sel != null) cls = "done";
    return `<button class="${cls} ${i === c.idx ? "cur" : ""}" data-action="goto" data-i="${i}" aria-label="${T("Savol")} ${i + 1}" ${i === c.idx ? 'aria-current="step"' : ""}>${i + 1}</button>`;
  }).join("")}</div>
  <div class="card">
    <div class="pad">
      <div class="row"><span class="pill">${T(CAT[q.cat]?.name || "")}</span><span class="pill blue">${T("Mashq savoli")}</span><span class="pill warn">${T("Ekspert tekshiruvi kutilmoqda")}</span>
        <button class="btn sm" style="margin-left:auto" data-action="save" data-code="${code}" aria-pressed="${Store.s.saved.includes(code)}">${Store.s.saved.includes(code) ? "★ " + T("Saqlangan") : "☆ " + T("Saqlash")}</button></div>
      <h2 class="qtext">${T(q.text)}</h2>
      ${media ? `<div class="media">${media}</div>` : ""}
    </div>
    <div class="opts" role="radiogroup" aria-label="${T("Javob variantlari")}">${q.opts.map((o, i) => {
      let cls = ""; if (locked) { if (i === q.a) cls = "right"; else if (i === a.sel) cls = "wrong"; } else if (a.sel === i) cls = "sel";
      return `<button class="opt ${cls}" role="radio" aria-checked="${a.sel === i}" data-action="pick" data-i="${i}" ${locked ? "disabled" : ""}><span class="k">${L[i]}</span><span>${T(o)}</span></button>`;
    }).join("")}</div>
    ${locked ? `<div class="fb ${a.sel === q.a ? "ok" : "bad"}" role="status">${T(a.sel == null ? "Javob berilmagan (oldindan ko'rildi)" : a.sel === q.a ? "To'g'ri!" : "Noto'g'ri")}
      <button class="btn sm" style="margin-left:auto" data-action="explain">${T("Nima uchun?")}</button></div>` : ""}
  </div>
  <p id="note" class="small" role="alert" style="color:var(--warn);min-height:1em;margin:8px 0 0"></p>
  ${exam ? `<p class="small muted" style="margin:4px 0 0">${T("Imtihon rejimida to'g'ri javoblar test yakunlangandan keyin ko'rsatiladi.")}</p>` : ""}
  <div class="controls">
    <button class="btn" data-action="prev" ${c.idx === 0 ? "disabled" : ""} aria-label="${T("Oldingi savol")}">← <span class="hide-sm">${T("Oldingi")}</span></button>
    ${exam ? `<span class="wide"></span>` : `<button class="btn accent wide" data-action="check" ${locked ? "disabled" : ""}>${T("Javobni tekshirish")}</button>`}
    <button class="btn" data-action="next" ${c.idx === c.qs.length - 1 ? "disabled" : ""} aria-label="${T("Keyingi savol")}"><span class="hide-sm">${T("Keyingi")}</span> →</button>
    ${exam ? "" : `<button class="btn soft wide" data-action="reveal">${T("To'g'ri javobni ko'rish")}</button>`}
    <button class="btn primary ${exam ? "" : "wide"} push" style="${exam ? "grid-column:span 4" : ""}" data-action="finish-ask">${T("Testni yakunlash")}</button>
  </div>
  <p class="kbd">${T("Klaviatura: 1–4 yoki A–D — tanlash, Enter — tekshirish, ← → — savollar")}</p></div>`;
}
function afterTest() {
  const c = Store.s.current; if (!c || !c.deadline) return;
  const tick = () => {
    const left = Math.max(0, Math.round((c.deadline - Date.now()) / 1000));
    const el = document.getElementById("timer");
    if (el) { el.textContent = fmtTime(left); el.classList.toggle("low", left < 60); }
    if (left <= 0) { clearInterval(timerId); finishTest(true); }
  };
  tick(); timerId = setInterval(tick, 500);
}
function note(msg) { const n = document.getElementById("note"); if (n) n.textContent = tr(msg); }

// ───────────────── Natija ─────────────────
let reviewOnlyWrong = true;
function vResult() {
  const r = Store.s.lastResult;
  if (!r) return `<div class="card pad" style="text-align:center"><a class="btn accent" href="#biletlar">${T("Biletlarga o'tish")}</a></div>`;
  const pct = Math.round(r.correct / r.total * 100), wrong = r.total - r.correct;
  const prev = Store.s.history.filter((h) => h.id !== r.id && h.at < r.at && (r.kind === "TICKET" ? h.ticket === r.ticket && h.kind === "TICKET" : h.kind === r.kind)).slice(-5).reverse();
  const diff = prev[0] ? r.correct - prev[0].correct : null;
  const next = r.kind === "TICKET" ? D.tickets.find((t) => t.n > r.ticket) : null;
  const exam = r.maxErrors != null;
  const ok = r.passed;
  const list = r.qs.filter((k) => !reviewOnlyWrong || (r.ans[k]?.sel !== Q[k].a));
  return `<div style="max-width:820px;margin:auto;display:grid;gap:14px">
  <div class="card">
    <div class="result-head ${ok ? "ok" : "bad"}">
      <h1>${T("Test natijasi")}</h1>
      <p style="font-weight:700;color:var(${ok ? "--ok" : "--bad"});margin:6px 0">${T(exam ? (ok ? "Imtihon topshirildi" : "Imtihon topshirilmadi") : ok ? "Tabriklaymiz! Barcha javoblar to'g'ri" : "Xatolar bor — ularni qayta ishlang")}</p>
      ${exam ? `<p class="small muted" style="margin:0">${T("Ruxsat etilgan xatolar")}: ${r.maxErrors}</p>` : ""}
      <div class="ring"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.9" fill="none" stroke="var(--line)" stroke-width="3"/><circle cx="18" cy="18" r="15.9" fill="none" stroke="var(${ok ? "--ok" : "--bad"})" stroke-width="3" stroke-linecap="round" stroke-dasharray="${pct} 100"/></svg><b>${pct}%</b></div>
    </div>
    <div class="kv">
      <div><span>${T("Jami savollar")}</span><b>${r.total}</b></div>
      <div><span>${T("To'g'ri javoblar")}</span><b style="color:var(--ok)">${r.correct}</b></div>
      <div><span>${T("Noto'g'ri javoblar")}</span><b style="color:var(--bad)">${wrong}</b></div>
      <div><span>${T("Natija")}</span><b>${pct}%</b></div>
      <div><span>${T("Sarflangan vaqt")}</span><b>${fmtTime(r.dur)}</b></div>
      <div><span>${T("Bilet raqami")}</span><b>${r.ticket ? "№" + r.ticket : "—"}</b></div>
    </div>
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
    <a class="btn danger" href="#review">${T("Xatolarni ko'rish")}</a>
    <button class="btn" data-action="retry">${T("Qayta ishlash")}</button>
    ${next ? `<button class="btn accent" data-action="start" data-kind="TICKET" data-mode="${r.mode}" data-ticket="${next.n}">${T("Keyingi bilet")} →</button>` : `<a class="btn accent" href="#xatolar">${T("Xatolarim")}</a>`}
    <a class="btn" href="#biletlar">${T("Barcha biletlar")}</a>
  </div>
  <div class="card pad"><h3 style="font-size:16px">${T("Oldingi natijalar bilan taqqoslash")}</h3>
    ${prev.length ? `<p style="font-weight:700;color:var(${diff > 0 ? "--ok" : diff < 0 ? "--bad" : "--muted"})">${T(diff > 0 ? `Oldingi urinishdan ${diff} ta yaxshiroq` : diff < 0 ? `Oldingi urinishdan ${-diff} ta kamroq` : "Oldingi urinish bilan bir xil")}</p>
      ${prev.map((p) => `<div class="row small" style="justify-content:space-between;border-top:1px solid var(--line);padding:6px 0"><span class="muted">${esc(fmtDate(p.at))}</span><b>${p.correct}/${p.total} · ${fmtTime(p.dur)}</b></div>`).join("")}`
    : `<p class="muted small">${T("Bu bo'lim bo'yicha avvalgi natijalar yo'q.")}</p>`}</div>
  <section id="review" style="display:grid;gap:10px;scroll-margin-top:120px">
    <div class="row" style="justify-content:space-between"><h2 style="font-size:20px">${T("Javoblar tahlili")}</h2>
      <div class="tabs"><button data-action="rv" data-w="1" aria-pressed="${reviewOnlyWrong}">${T("Faqat xatolar")} (${wrong})</button><button data-action="rv" data-w="0" aria-pressed="${!reviewOnlyWrong}">${T("Hammasi")} (${r.total})</button></div></div>
    ${list.length ? list.map((k) => {
      const q = Q[k], s = r.ans[k]?.sel, good = s === q.a;
      return `<details class="card pad"><summary style="color:var(--fg);list-style:none;display:flex;gap:8px"><span style="color:var(${good ? "--ok" : "--bad"});font-weight:800">${good ? "✓" : "✗"}</span><span>${r.qs.indexOf(k) + 1}. ${T(q.text)}</span></summary>
        <div style="display:grid;gap:8px;margin-top:12px">${q.scene || (q.sign ? `<div class="media" style="margin:0">${D.signSvg[q.sign] || ""}</div>` : "")}
        ${q.opts.map((o, i) => `<div class="other ${i === q.a ? "" : i === s ? "yours" : ""}" style="${i === q.a ? "border:2px solid var(--ok);background:var(--ok-soft);font-weight:600" : ""}">${L[i]}) ${T(o)}${i === s && !good ? ` <span class="small" style="color:var(--bad)">← ${T("sizning javobingiz")}</span>` : ""}</div>`).join("")}
        ${s == null ? `<p class="small" style="color:var(--bad);margin:0">${T("Javob berilmagan")}</p>` : ""}
        <p style="margin:0">${T(q.exp)}</p><p class="small muted" style="margin:0">${T(q.rule || "")}</p></div></details>`;
    }).join("") : `<p class="muted">${T("Xato yo'q.")}</p>`}
  </section></div>`;
}

// ───────────────── Modal: to'g'ri javob ─────────────────
function openExplain(code, sel) {
  const q = Q[code];
  const others = q.opts.map((o, i) => i === q.a ? "" : `<div class="other ${i === sel ? "yours" : ""}"><b>${L[i]}) ${T(o)}</b>${i === sel ? ` <span class="pill bad">${T("sizning javobingiz")}</span>` : ""}<div class="small muted">${T(q.notes[i] || "Bu variant savol shartiga va ko'rsatilgan YHQ bandiga mos kelmaydi.")}</div></div>`).join("");
  const c = Store.s.current; const hasNext = c && c.idx < c.qs.length - 1;
  document.getElementById("modal-root").innerHTML = `<div class="overlay" data-action="close-overlay"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt">
    <header><h2 id="mt" style="font-size:18px">${T("To'g'ri javob")}</h2><button class="btn sm" data-action="close" aria-label="${T("Yopish")}">✕</button></header>
    <div class="body">
      <div class="answer-box"><div class="lbl">${T("TO'G'RI JAVOB")}: ${L[q.a]}</div><div class="txt">${T(q.opts[q.a])}</div></div>
      <section><h3 style="font-size:15px;margin-bottom:6px">${T("Nima uchun bu javob to'g'ri")}</h3><p style="margin:0">${T(q.exp)}</p></section>
      <section style="display:grid;gap:8px"><h3 style="font-size:15px">${T("Boshqa variantlar")}</h3>${others}</section>
      <div class="rule"><b>${T("Tegishli qoida")}:</b> ${T(q.rule || "—")}<br><b>${T("Manba")}:</b> ${T(q.firstAid ? "Birinchi tibbiy yordam bo'yicha umumqabul qilingan tavsiyalar (mutaxassis tekshiruvini kutmoqda)" : "O'zbekiston Respublikasi Yo'l harakati qoidalari, VM 172-son qarori")}<br><a href="${D.law}" target="_blank" rel="noopener">${T("lex.uz da ochish")} ↗</a></div>
    </div>
    <footer><button class="btn" data-action="close">${T("Yopish")}</button>${hasNext && view() === "test" ? `<button class="btn accent" data-action="modal-next">${T("Keyingi savol")}</button>` : ""}</footer></div></div>`;
  document.querySelector(".sheet [data-action=close]").focus();
}
function closeModal() { const m = document.getElementById("modal-root"); if (m) m.innerHTML = ""; }
function confirmBox(title, text, okLabel, action) {
  document.getElementById("modal-root").innerHTML = `<div class="overlay" data-action="close-overlay"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ct">
    <header><h2 id="ct" style="font-size:18px">${T(title)}</h2></header><div class="body"><p style="margin:0">${T(text)}</p></div>
    <footer><button class="btn" data-action="close">${T("Bekor qilish")}</button><button class="btn primary" data-action="${action}">${T(okLabel)}</button></footer></div></div>`;
}
function openSign(code) {
  const s = D.signs.find((x) => x.code === code);
  document.getElementById("modal-root").innerHTML = `<div class="overlay" data-action="close-overlay"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="st">
    <header><h2 id="st" style="font-size:18px">${s.code} — ${T(s.name)}</h2><button class="btn sm" data-action="close" aria-label="${T("Yopish")}">✕</button></header>
    <div class="body"><div class="media" style="margin:0">${(D.signSvg[s.code] || "").replace('class="sign', 'style="width:150px;height:150px" class="sign')}</div>
    <section><h3 style="font-size:15px">${T("Ma'nosi")}</h3><p style="margin:4px 0 0">${T(s.meaning)}</p></section>
    ${s.usage ? `<section><h3 style="font-size:15px">${T("Qo'llanishi")}</h3><p style="margin:4px 0 0">${T(s.usage)}</p></section>` : ""}
    <div class="rule"><b>${T("Qoida")}:</b> ${T(s.rule || "")} · <a href="${D.law}" target="_blank" rel="noopener">lex.uz ↗</a></div></div></div></div>`;
}

// ───────────────── Hodisalar ─────────────────
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]"); if (!el) return;
  const act = el.dataset.action; const c = Store.s.current;
  if (act === "close-overlay" && e.target !== el) return;
  switch (act) {
    case "script": cyr = !cyr; try { localStorage.setItem("yhq-cyr", cyr ? "1" : ""); } catch {} render(); break;
    case "start": {
      const kind = el.dataset.kind;
      if (kind === "MISTAKES") startTest({ kind, codes: Object.keys(Store.s.prog).filter((k) => Store.s.prog[k].mis && Q[k]) });
      else if (kind === "SAVED") startTest({ kind, codes: Store.s.saved.filter((k) => Q[k]) });
      else startTest({ kind, mode: el.dataset.mode || "LEARN", ticket: el.dataset.ticket ? Number(el.dataset.ticket) : undefined, cat: el.dataset.cat });
      break;
    }
    case "pick": {
      if (!c) return; const code = c.qs[c.idx]; const a = c.ans[code] || (c.ans[code] = {});
      if (c.mode !== "EXAM" && (a.checked || a.revealed)) return;
      a.sel = Number(el.dataset.i);
      if (c.mode === "EXAM") Store.save();
      render(); break;
    }
    case "check": {
      if (!c) return; const code = c.qs[c.idx]; const a = c.ans[code];
      if (!a || a.sel == null) { note("Avval javob variantini tanlang"); return; }
      a.checked = true; applyAnswer(code, a.sel === Q[code].a); Store.save(); render(); break;
    }
    case "reveal": {
      if (!c || c.mode === "EXAM") return; const code = c.qs[c.idx]; const a = c.ans[code] || (c.ans[code] = {});
      if (!a.checked && !a.revealed) { a.revealed = true; a.sel = undefined; applyAnswer(code, false); Store.save(); render(); }
      openExplain(code, a.sel); break;
    }
    case "explain": if (c) openExplain(c.qs[c.idx], c.ans[c.qs[c.idx]]?.sel); break;
    case "goto": if (c) { c.idx = Number(el.dataset.i); Store.save(); render(); } break;
    case "prev": if (c && c.idx > 0) { c.idx--; Store.save(); render(); } break;
    case "next": if (c && c.idx < c.qs.length - 1) { c.idx++; Store.save(); render(); } break;
    case "modal-next": closeModal(); if (c && c.idx < c.qs.length - 1) { c.idx++; Store.save(); render(); } break;
    case "finish-ask": {
      if (!c) return; const un = c.qs.filter((k) => !c.ans[k] || c.ans[k].sel == null).length;
      confirmBox("Testni yakunlaysizmi?", un ? `${un} ta savolga javob berilmagan. Ular noto'g'ri hisoblanadi.` : "Barcha savollarga javob berildi.", "Ha, yakunlash", "finish"); break;
    }
    case "finish": closeModal(); finishTest(false); break;
    case "close": case "close-overlay": closeModal(); break;
    case "save": {
      const code = el.dataset.code; const i = Store.s.saved.indexOf(code);
      if (i >= 0) Store.s.saved.splice(i, 1); else Store.s.saved.push(code);
      Store.save(); render(); break;
    }
    case "retry": { const r = Store.s.lastResult; if (!r) return;
      if (["MISTAKES", "SAVED"].includes(r.kind)) startTest({ kind: r.kind, codes: r.qs }); else startTest({ kind: r.kind, mode: r.mode, ticket: r.ticket ?? undefined, cat: r.cat ?? undefined }); break; }
    case "rv": reviewOnlyWrong = el.dataset.w === "1"; render(); document.getElementById("review")?.scrollIntoView(); break;
    case "review": { const r = Store.s.history.find((h) => h.id === el.dataset.id); if (r) { Store.s.lastResult = r; go("natija"); } break; }
    case "sgroup": signGroup = el.dataset.g; render(); break;
    case "sign": openSign(el.dataset.code); break;
    case "reset-ask": confirmBox("Natijalarni tozalash", "Barcha natijalar, xatolar va saqlangan savollar o'chiriladi. Bu amalni qaytarib bo'lmaydi.", "Tozalash", "reset"); break;
    case "reset": closeModal(); Store.s = blank(); Store.save(); render(); break;
  }
});
document.addEventListener("click", (e) => { const a = e.target.closest('a[href="#review"]'); if (a) { e.preventDefault(); document.getElementById("review")?.scrollIntoView({ behavior: "smooth" }); } });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeModal(); return; }
  if (view() !== "test" || document.querySelector(".overlay")) return;
  if (["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) return;
  const map = { 1: 0, 2: 1, 3: 2, 4: 3, a: 0, b: 1, c: 2, d: 3 }; const k = e.key.toLowerCase();
  const c = Store.s.current; if (!c) return;
  const click = (sel) => document.querySelector(sel)?.click();
  if (k in map) { const btn = document.querySelectorAll(".opt")[map[k]]; if (btn && !btn.disabled) { e.preventDefault(); btn.click(); } }
  else if (k === "enter") { e.preventDefault(); c.mode === "EXAM" ? click("[data-action=next]") : click("[data-action=check]"); }
  else if (k === "arrowright") click("[data-action=next]");
  else if (k === "arrowleft") click("[data-action=prev]");
});

// ───────────────── Ishga tushirish ─────────────────
(async () => {
  try { cyr = localStorage.getItem("yhq-cyr") === "1"; } catch {}
  Store.load();
  try { await loadData(); }
  catch { document.getElementById("app").innerHTML = `<div class="card pad" style="text-align:center"><b>Savollar bazasini yuklab bo'lmadi.</b><p class="muted">Internet aloqasini tekshirib, sahifani qayta oching.</p></div>`; return; }
  render();
  Store.connect();
})();
</script>
