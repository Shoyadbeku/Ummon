<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mening ovozim</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --text:#1d1d1f; --muted:#6b6b70; --accent:#2f6f5e; --border:#e2e0da; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141415; --card:#1e1e20; --text:#ededee; --muted:#9a9aa0; --accent:#5fb39a; --border:#2e2e31; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 40px 16px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; }
  textarea { width:100%; min-height:160px; resize:vertical; padding:12px; border-radius:10px; border:1px solid var(--border);
             background:transparent; color:inherit; font:inherit; }
  .row { display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-top:14px; }
  label { color:var(--muted); font-size:14px; }
  input[type=range] { accent-color: var(--accent); }
  button { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:11px 22px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  audio { width:100%; margin-top:16px; }
  .count { margin-left:auto; color:var(--muted); font-size:13px; }
  a.dl { color:var(--accent); font-size:14px; }
  .err { color:#c0392b; margin-top:10px; }
</style>
</head>
<body>
<main>
  <h1>Mening ovozim</h1>
  <p class="sub">Matnni yozing — u mening ovozimdan o'qitilgan LoRA model orqali ovozga aylanadi.</p>
  <div class="card">
    <textarea id="text" maxlength="2000">Assalomu alaykum! Bu mening sun'iy intellekt yordamida yaratilgan ovozim.</textarea>
    <div class="row">
      <label>Tezlik <input id="speed" type="range" min="0.6" max="1.6" step="0.05" value="1"> <span id="sv">1.00×</span></label>
      <span class="count" id="count"></span>
    </div>
    <div class="row">
      <button id="go">Ovozga aylantirish</button>
      <a id="dl" class="dl" download="ovoz.wav" hidden>Yuklab olish</a>
    </div>
    <div id="err" class="err" hidden></div>
    <audio id="player" controls hidden></audio>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const upd = () => { $('count').textContent = $('text').value.length + ' / 2000'; $('sv').textContent = (+$('speed').value).toFixed(2) + '×'; };
$('text').oninput = upd; $('speed').oninput = upd; upd();
$('go').onclick = async () => {
  const text = $('text').value.trim(); if (!text) return;
  $('go').disabled = true; $('go').textContent = 'Tayyorlanmoqda…'; $('err').hidden = true;
  try {
    const r = await fetch('/api/tts', { method:'POST', headers:{'Content-Type':'application/json'},
                                       body: JSON.stringify({ text, speed: +$('speed').value }) });
    if (!r.ok) throw new Error('Server xatosi: ' + r.status);
    const url = URL.createObjectURL(await r.blob());
    $('player').src = url; $('player').hidden = false; $('player').play();
    $('dl').href = url; $('dl').hidden = false;
  } catch (e) { $('err').textContent = e.message; $('err').hidden = false; }
  finally { $('go').disabled = false; $('go').textContent = 'Ovozga aylantirish'; }
};
</script>
</body>
</html>
